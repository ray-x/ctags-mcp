name: build-binaries

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            binary_name: ctags-mcp-darwin-arm64
            artifact_name: ctags-mcp-darwin-arm64
          - goos: linux
            goarch: amd64
            binary_name: ctags-mcp-linux-amd64
            artifact_name: ctags-mcp-linux-amd64
          - goos: windows
            goarch: amd64
            binary_name: ctags-mcp-windows-amd64.exe
            artifact_name: ctags-mcp-windows-amd64
          - goos: linux
            goarch: arm64
            binary_name: ctags-mcp-linux-arm64
            artifact_name: ctags-mcp-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary_name }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error
